
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K. Fragrance — Maison De Parfum</title>
  <!-- Google Fonts for Luxury Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    /* RESET & BASE STYLES */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0b0b0b;
      color: #f5f5f5;
      font-family: 'Montserrat', sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* BACKGROUND OVERLAY & HERO */
    .hero-container {
      position: relative;
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 2rem 1.5rem;
      background: radial-gradient(circle at center, rgba(30, 10, 15, 0.85) 0%, rgba(10, 10, 10, 0.98) 80%),
                  url('https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?q=80&w=1000&auto=format&fit=crop') center/cover no-repeat;
    }

    /* HEADER / NAVBAR */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
    }

    .brand-title {
      font-family: 'Cinzel', serif;
      font-size: 1.5rem;
      letter-spacing: 2px;
      color: #d4af37; /* Gold accent */
      font-weight: 600;
    }

    .brand-subtitle {
      font-size: 0.65rem;
      letter-spacing: 4px;
      color: #a3a3a3;
      text-transform: uppercase;
      margin-top: 2px;
    }

    .nav-link {
      font-size: 0.8rem;
      letter-spacing: 2px;
      color: #d4af37;
      text-decoration: none;
      text-transform: uppercase;
      font-weight: 500;
      transition: color 0.3s ease;
    }

    .nav-link:hover {
      color: #ffffff;
    }

    /* HERO CONTENT */
    .hero-content {
      max-width: 650px;
      margin: 4rem auto 2rem 0;
      padding-left: 0.5rem;
    }

    .tagline-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #d4af37;
      font-size: 0.75rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }

    .tagline-badge::before {
      content: '';
      width: 30px;
      height: 1px;
      background-color: #d4af37;
    }

    .hero-heading {
      font-family: 'Cinzel', serif;
      font-size: 2.8rem;
      line-height: 1.2;
      font-weight: 400;
      color: #ffffff;
      margin-bottom: 1.5rem;
    }

    .hero-heading span.italic-gold {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      color: #e5c158;
      font-weight: 400;
    }

    .hero-description {
      font-size: 0.95rem;
      line-height: 1.7;
      color: #cccccc;
      font-weight: 300;
      margin-bottom: 2.5rem;
      max-width: 520px;
    }

    /* ACTION BUTTONS */
    .button-group {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
      max-width: 320px;
    }

    .btn {
      padding: 1rem 1.8rem;
      font-size: 0.8rem;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      transition: all 0.3s ease;
      border: 1px solid transparent;
    }

    .btn-primary {
      background-color: #e5c158;
      color: #0b0b0b;
      border-color: #e5c158;
    }

    .btn-primary:hover {
      background-color: #c9a43b;
      border-color: #c9a43b;
    }

    .btn-secondary {
      background-color: transparent;
      color: #e5c158;
      border-color: #e5c158;
    }

    .btn-secondary:hover {
      background-color: rgba(229, 193, 88, 0.1);
      color: #ffffff;
    }

    /* RESPONSIVE DESIGN */
    @media (min-width: 768px) {
      .hero-container {
        padding: 3rem 4rem;
      }

      .brand-title {
        font-size: 1.8rem;
      }

      .hero-heading {
        font-size: 3.8rem;
      }

      .button-group {
        flex-direction: row;
        max-width: 100%;
      }

      .btn {
        min-width: 180px;
      }
    }
  </style>
</head>
<body>

  <div class="hero-container">
    <!-- NAVBAR -->
    <header>
      <div class="brand-box">
        <h1 class="brand-title">K. Fragrance</h1>
        <div class="brand-subtitle">Maison De Parfum</div>
      </div>
      <a href="#watches" class="nav-link">Watches</a>
    </header>

    <!-- MAIN HERO CONTENT -->
    <main class="hero-content">
      <div class="tagline-badge">The House of K. Fragrance</div>
      
      <h2 class="hero-heading">
        Scents That Linger <span class="italic-gold">Long After</span> You Leave
      </h2>

      <p class="hero-description">
        Hand-blended in small batches and aged before bottling. Honest prices, uncompromising ingredients — built to last in the room, and in memory.
      </p>

      <div class="button-group">
        <a href="#shop" class="btn btn-primary">Shop Now</a>
        <a href="#explore" class="btn btn-secondary">Explore Collection</a>
      </div>
    </main>

    <!-- FOOTER SPACER / ACCENT -->
    <footer></footer>
  </div>

</body>
</html>
